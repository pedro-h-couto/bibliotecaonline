<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Autores - Biblioteca</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
            <nav class="navbar">
        <a href="dashboard.html" class="navbar-brand">
            <span class="logo-emoji">📚</span>
            Biblioteca Online
        </a>
        <ul class="navbar-nav">
            <li><a href="autores.html" class="active">✍️ Autores</a></li>
            <li><a href="categorias.html" class="">🏷️ Categorias</a></li>
            <li><a href="livros.html" class="">📖 Livros</a></li>
            <li><a href="leitores.html" class="">👥 Leitores</a></li>
            <li><a href="emprestimos.html" class="">🔄 Empréstimos</a></li>
        </ul>
        <div class="navbar-actions">
            <span id="usuarioNome"></span>
            <button onclick="logout()">🚪 Sair</button>
        </div>
    </nav>

    <div class="container">
        <div class="form-section">
            <h3 id="formTitle">Novo Autor</h3>
            <form id="autorForm">
                <input type="hidden" id="idAutor">
                <div class="form-row">
                    <div class="form-group">
                        <label>Nome</label>
                        <input type="text" id="nome" required>
                    </div>
                    <div class="form-group">
                        <label>Nacionalidade</label>
                        <input type="text" id="nacionalidade" required>
                    </div>
                </div>
                <button type="submit">Salvar</button>
                <button type="button" class="secondary" onclick="resetForm()">Cancelar</button>
                <div id="mensagem"></div>
            </form>
        </div>
        <div class="list-section">
            <h3>Lista de Autores</h3>
            <table id="tabelaAutores">
                <thead>
                    <tr><th>ID</th><th>Nome</th><th>Nacionalidade</th><th>Ações</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
    <script src="js/auth.js"></script>
    <script>
        const form = document.getElementById('autorForm');
        const tbody = document.querySelector('#tabelaAutores tbody');

        async function carregar() {
            try {
                const res = await fetch(`${API_URL}/autores`, {headers: authHeaders()});
                const data = await res.json();
                tbody.innerHTML = '';
                if (data.success && data.data.autores) {
                    data.data.autores.forEach(a => {
                        tbody.innerHTML += `
                            <tr>
                                <td>${a.idAutor}</td>
                                <td>${a.nome}</td>
                                <td>${a.nacionalidade}</td>
                                <td class="actions">
                                    <button onclick="editar(${a.idAutor}, '${a.nome}', '${a.nacionalidade}')">✏️ Editar</button>
                                    <button class="danger" onclick="excluir(${a.idAutor})">🗑️ Excluir</button>
                                </td>
                            </tr>`;
                    });
                }
            } catch (e) { showMessage('mensagem', 'Erro ao carregar autores', 'error'); }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('idAutor').value;
            const payload = {
                nome: document.getElementById('nome').value,
                nacionalidade: document.getElementById('nacionalidade').value
            };
            const url = id ? `${API_URL}/autores/${id}` : `${API_URL}/autores`;
            const method = id ? 'PUT' : 'POST';

            try {
                const res = await fetch(url, {method, headers: authHeaders(), body: JSON.stringify(payload)});
                const data = await res.json();
                showMessage('mensagem', data.message, data.success ? 'success' : 'error');
                resetForm(); carregar();
            } catch (e) { showMessage('mensagem', 'Erro ao salvar', 'error'); }
        });

        function editar(id, nome, nacionalidade) {
            document.getElementById('idAutor').value = id;
            document.getElementById('nome').value = nome;
            document.getElementById('nacionalidade').value = nacionalidade;
            document.getElementById('formTitle').textContent = 'Editar Autor';
        }

        function resetForm() {
            form.reset(); document.getElementById('idAutor').value = '';
            document.getElementById('formTitle').textContent = 'Novo Autor';
        }

        async function excluir(id) {
            if (!confirm('Deseja excluir este autor?')) return;
            try {
                const res = await fetch(`${API_URL}/autores/${id}`, {method: 'DELETE', headers: authHeaders()});
                const data = await res.json();
                alert(data.message); carregar();
            } catch (e) { alert('Erro ao excluir'); }
        }

        carregar();
    </script>
</body>
</html>
