<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Emprestimos - Biblioteca</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
            <nav class="navbar">
        <a href="dashboard.html" class="navbar-brand">
            <span class="logo-emoji">📚</span>
            Biblioteca Online
        </a>
        <ul class="navbar-nav">
            <li><a href="autores.html" class="">✍️ Autores</a></li>
            <li><a href="categorias.html" class="">🏷️ Categorias</a></li>
            <li><a href="livros.html" class="">📖 Livros</a></li>
            <li><a href="leitores.html" class="">👥 Leitores</a></li>
            <li><a href="emprestimos.html" class="active">🔄 Empréstimos</a></li>
        </ul>
        <div class="navbar-actions">
            <span id="usuarioNome"></span>
            <button onclick="logout()">🚪 Sair</button>
        </div>
    </nav>

    <div class="container">
        <div class="form-section">
            <h3 id="formTitle">Novo Emprestimo</h3>
            <form id="emprestimoForm">
                <input type="hidden" id="idEmprestimo">
                <div class="form-row">
                    <div class="form-group"><label>Data Emprestimo</label><input type="date" id="dataEmprestimo" required></div>
                    <div class="form-group"><label>Data Devolucao</label><input type="date" id="dataDevolucao"></div>
                    <div class="form-group"><label>Status</label>
                        <select id="status" required>
                            <option value="ativo">Ativo</option>
                            <option value="devolvido">Devolvido</option>
                            <option value="atrasado">Atrasado</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>ID Livro</label><input type="number" id="idLivroEmp" required></div>
                    <div class="form-group"><label>ID Leitor</label><input type="number" id="idLeitorEmp" required></div>
                </div>
                <button type="submit">Salvar</button>
                <button type="button" class="secondary" onclick="resetForm()">Cancelar</button>
                <div id="mensagem"></div>
            </form>
        </div>
        <div class="list-section">
            <h3>Lista de Emprestimos</h3>
            <table id="tabelaEmprestimos">
                <thead><tr><th>ID</th><th>Data</th><th>Devolucao</th><th>Status</th><th>Livro</th><th>Leitor</th><th>Acoes</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
    <script src="js/auth.js"></script>
    <script>
        const form = document.getElementById('emprestimoForm');
        const tbody = document.querySelector('#tabelaEmprestimos tbody');

        async function carregar() {
            try {
                const res = await fetch(`${API_URL}/emprestimos`, {headers: authHeaders()});
                const data = await res.json();
                tbody.innerHTML = '';
                if (data.success && data.data.emprestimos) {
                    data.data.emprestimos.forEach(e => {
                        tbody.innerHTML += `
                            <tr>
                                <td>${e.idEmprestimo}</td>
                                <td>${e.dataEmprestimo}</td>
                                <td>${e.dataDevolucao || '-'}</td>
                                <td>${e.status}</td>
                                <td>${e.livro ? e.livro.titulo : ''}</td>
                                <td>${e.leitor ? e.leitor.nome : ''}</td>
                                <td class="actions">
                                    <button onclick="editar(${e.idEmprestimo}, '${e.dataEmprestimo}', '${e.dataDevolucao || ''}', '${e.status}', ${e.livro.idLivro}, ${e.leitor.idLeitor})">✏️ Editar</button>
                                    <button class="danger" onclick="excluir(${e.idEmprestimo})">🗑️ Excluir</button>
                                </td>
                            </tr>`;
                    });
                }
            } catch (e) { showMessage('mensagem', 'Erro ao carregar', 'error'); }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('idEmprestimo').value;
            const payload = {
                dataEmprestimo: document.getElementById('dataEmprestimo').value,
                dataDevolucao: document.getElementById('dataDevolucao').value || null,
                status: document.getElementById('status').value,
                idLivro: parseInt(document.getElementById('idLivroEmp').value),
                idLeitor: parseInt(document.getElementById('idLeitorEmp').value)
            };
            const url = id ? `${API_URL}/emprestimos/${id}` : `${API_URL}/emprestimos`;
            const method = id ? 'PUT' : 'POST';

            try {
                const res = await fetch(url, {method, headers: authHeaders(), body: JSON.stringify(payload)});
                const data = await res.json();
                showMessage('mensagem', data.message, data.success ? 'success' : 'error');
                resetForm(); carregar();
            } catch (e) { showMessage('mensagem', 'Erro ao salvar', 'error'); }
        });

        function editar(id, dataEmp, dataDev, status, idLivro, idLeitor) {
            document.getElementById('idEmprestimo').value = id;
            document.getElementById('dataEmprestimo').value = dataEmp;
            document.getElementById('dataDevolucao').value = dataDev;
            document.getElementById('status').value = status;
            document.getElementById('idLivroEmp').value = idLivro;
            document.getElementById('idLeitorEmp').value = idLeitor;
            document.getElementById('formTitle').textContent = 'Editar Emprestimo';
        }

        function resetForm() {
            form.reset(); document.getElementById('idEmprestimo').value = '';
            document.getElementById('formTitle').textContent = 'Novo Emprestimo';
        }

        async function excluir(id) {
            if (!confirm('Deseja excluir?')) return;
            try {
                const res = await fetch(`${API_URL}/emprestimos/${id}`, {method: 'DELETE', headers: authHeaders()});
                const data = await res.json(); alert(data.message); carregar();
            } catch (e) { alert('Erro ao excluir'); }
        }

        carregar();
    </script>
</body>
</html>
