<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Leitores - Biblioteca</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
            <nav class="navbar">
        <a href="dashboard.html" class="navbar-brand">
            <span class="logo-emoji">📚</span>
            Biblioteca Online
        </a>
        <ul class="navbar-nav">
            <li><a href="autores.html" class="">✍️ Autores</a></li>
            <li><a href="categorias.html" class="">🏷️ Categorias</a></li>
            <li><a href="livros.html" class="">📖 Livros</a></li>
            <li><a href="leitores.html" class="active">👥 Leitores</a></li>
            <li><a href="emprestimos.html" class="">🔄 Empréstimos</a></li>
        </ul>
        <div class="navbar-actions">
            <span id="usuarioNome"></span>
            <button onclick="logout()">🚪 Sair</button>
        </div>
    </nav>

    <div class="container">
        <div class="form-section">
            <h3 id="formTitle">Novo Leitor</h3>
            <form id="leitorForm">
                <input type="hidden" id="idLeitor">
                <div class="form-row">
                    <div class="form-group"><label>Nome</label><input type="text" id="nome" required></div>
                    <div class="form-group"><label>Email</label><input type="email" id="email" required></div>
                    <div class="form-group"><label>Telefone</label><input type="text" id="telefone"></div>
                </div>
                <button type="submit">Salvar</button>
                <button type="button" class="secondary" onclick="resetForm()">Cancelar</button>
                <div id="mensagem"></div>
            </form>
        </div>
        <div class="list-section">
            <h3>Lista de Leitores</h3>
            <table id="tabelaLeitores">
                <thead><tr><th>ID</th><th>Nome</th><th>Email</th><th>Telefone</th><th>Ações</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
    <script src="js/auth.js"></script>
    <script>
        const form = document.getElementById('leitorForm');
        const tbody = document.querySelector('#tabelaLeitores tbody');

        async function carregar() {
            try {
                const res = await fetch(`${API_URL}/leitores`, {headers: authHeaders()});
                const data = await res.json();
                tbody.innerHTML = '';
                if (data.success && data.data.leitores) {
                    data.data.leitores.forEach(l => {
                        tbody.innerHTML += `
                            <tr>
                                <td>${l.idLeitor}</td>
                                <td>${l.nome}</td>
                                <td>${l.email}</td>
                                <td>${l.telefone || ''}</td>
                                <td class="actions">
                                    <button onclick="editar(${l.idLeitor}, '${l.nome}', '${l.email}', '${l.telefone || ''}')">✏️ Editar</button>
                                    <button class="danger" onclick="excluir(${l.idLeitor})">🗑️ Excluir</button>
                                </td>
                            </tr>`;
                    });
                }
            } catch (e) { showMessage('mensagem', 'Erro ao carregar', 'error'); }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('idLeitor').value;
            const payload = {
                nome: document.getElementById('nome').value,
                email: document.getElementById('email').value,
                telefone: document.getElementById('telefone').value
            };
            const url = id ? `${API_URL}/leitores/${id}` : `${API_URL}/leitores`;
            const method = id ? 'PUT' : 'POST';

            try {
                const res = await fetch(url, {method, headers: authHeaders(), body: JSON.stringify(payload)});
                const data = await res.json();
                showMessage('mensagem', data.message, data.success ? 'success' : 'error');
                resetForm(); carregar();
            } catch (e) { showMessage('mensagem', 'Erro ao salvar', 'error'); }
        });

        function editar(id, nome, email, telefone) {
            document.getElementById('idLeitor').value = id;
            document.getElementById('nome').value = nome;
            document.getElementById('email').value = email;
            document.getElementById('telefone').value = telefone;
            document.getElementById('formTitle').textContent = 'Editar Leitor';
        }

        function resetForm() {
            form.reset(); document.getElementById('idLeitor').value = '';
            document.getElementById('formTitle').textContent = 'Novo Leitor';
        }

        async function excluir(id) {
            if (!confirm('Deseja excluir?')) return;
            try {
                const res = await fetch(`${API_URL}/leitores/${id}`, {method: 'DELETE', headers: authHeaders()});
                const data = await res.json(); alert(data.message); carregar();
            } catch (e) { alert('Erro ao excluir'); }
        }

        carregar();
    </script>
</body>
</html>
