<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Biblioteca Online</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-page">
        <div class="login-left">
            <div class="login-left-content">
                <div class="logo-emoji">📚</div>
                <h1>Biblioteca Online</h1>
                <p>Gerencie seu acervo de livros, autores, categorias e empréstimos de forma simples e eficiente.</p>
            </div>
        </div>

        <div class="login-right">
            <h2>Bem-vindo de volta!</h2>
            <p class="subtitle">Faça login para acessar o painel de controle da biblioteca.</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">📧 Email</label>
                    <input type="email" id="email" required placeholder="admin@biblioteca.com" value="admin@biblioteca.com">
                </div>
                <div class="form-group">
                    <label for="senha">🔒 Senha</label>
                    <input type="password" id="senha" required placeholder="123456" value="123456">
                </div>
                <button type="submit" style="width:100%">
                    📚 Entrar
                </button>
                <div id="mensagem"></div>
            </form>

            <p style="margin-top: 25px; text-align: center; color: #94a3b8; font-size: 0.85rem;">
                <span style="display: block; margin-bottom: 5px;">🔒 Acesso seguro com JWT</span>
                Demo: admin@biblioteca.com / 123456
            </p>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;

            try {
                const res = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({email, senha})
                });

                const data = await res.json();

                if (data.success) {
                    localStorage.setItem('token', data.data.token);
                    showMessage('mensagem', '✅ Login realizado! Redirecionando...', 'success');
                    setTimeout(() => window.location.href = 'dashboard.html', 1000);
                } else {
                    showMessage('mensagem', '❌ ' + (data.message || 'Erro no login'), 'error');
                }
            } catch (err) {
                showMessage('mensagem', '❌ Erro de conexao: ' + err.message, 'error');
            }
        });
    </script>
</body>
</html>
